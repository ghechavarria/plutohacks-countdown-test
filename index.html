<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlutoHacks Countdown</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="space-bg"></div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme">
      Light theme
    </button>
    <main class="app">
      <p class="eyebrow">PlutoHacks 2026</p>
      <h1 id="countdown-heading">Hacking starts in</h1>

      <div class="countdown" aria-live="polite">
        <div class="time-box">
          <span id="days" class="time-value">00</span>
          <span class="time-label">Days</span>
        </div>
        <div class="time-box">
          <span id="hours" class="time-value">00</span>
          <span class="time-label">Hours</span>
        </div>
        <div class="time-box">
          <span id="minutes" class="time-value">00</span>
          <span class="time-label">Minutes</span>
        </div>
        <div class="time-box">
          <span id="seconds" class="time-value">00</span>
          <span class="time-label">Seconds</span>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
